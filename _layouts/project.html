---
layout: default
---
<article class="container mx-auto px-8 pb-32 max-w-3xl">
    <p class="text-center mb-16">
        <a href="{{ '/#work' | relative_url }}" class="text-[10px] uppercase tracking-[0.3em] text-zinc-400 hover:text-zinc-900 transition">&larr; Back to work</a>
    </p>

    <div class="mb-12 flex justify-center">
        <img src="{{ page.image }}" alt="{{ page.title }}" class="w-full md:w-2/3 h-auto shadow-sm">
    </div>

    <div class="flex justify-between items-baseline mb-3 flex-wrap gap-2">
        <h1 class="text-xl font-light text-zinc-900 tracking-tight">{{ page.title }}</h1>
        <span class="text-[9px] uppercase tracking-[0.2em] text-zinc-400">{{ page.tags | join: " / " }}</span>
    </div>

    <div class="prose prose-zinc prose-sm font-light text-zinc-500 leading-relaxed max-w-none mt-8">
        {{ content }}
    </div>

    {% if page.repo %}
    <p class="mt-12 text-center">
        <a href="{{ page.repo }}" target="_blank" class="text-[10px] uppercase tracking-[0.3em] text-zinc-400 hover:text-zinc-900 transition underline underline-offset-8">Source on GitHub</a>
    </p>
    {% endif %}
</article>
