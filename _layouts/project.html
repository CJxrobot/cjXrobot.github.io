---
layout: default
---
<article class="container mx-auto px-6 md:px-8 pb-32 max-w-3xl">
    <p class="mb-16">
        <a href="{{ '/#work' | relative_url }}" class="font-mono text-[10px] uppercase tracking-[0.25em] text-zinc-500 hover:text-accent transition">&larr; Back to work</a>
    </p>

    <div class="mb-10 border-2 border-zinc-900 overflow-hidden">
        <img src="{{ page.image }}" alt="{{ page.title }}" class="w-full h-auto">
    </div>

    <div class="flex flex-wrap items-center gap-2 mb-5">
        <span class="font-mono text-[9px] uppercase tracking-[0.2em] text-zinc-400">{{ page.year }}</span>
        {% if page.status %}
        <span class="font-mono text-[9px] uppercase tracking-[0.2em] border border-zinc-300 text-zinc-500 px-3 py-1">{{ page.status }}</span>
        {% endif %}
        {% if page.domain %}
        <span class="font-mono text-[9px] uppercase tracking-[0.2em] border-2 border-accent text-accent px-3 py-1">{{ page.domain }}</span>
        {% endif %}
    </div>

    <div class="flex justify-between items-baseline mb-3 flex-wrap gap-2">
        <h1 class="font-display font-semibold text-2xl md:text-3xl text-zinc-900 tracking-tight">{{ page.title }}</h1>
        <span class="font-mono text-[9px] uppercase tracking-[0.2em] text-zinc-500">{{ page.tags | join: " / " }}</span>
    </div>

    <div class="lightbox-content prose prose-sm font-light text-zinc-600 leading-relaxed max-w-none mt-10 pt-10 border-t-2 border-zinc-900">
        {{ content }}
    </div>

    {% if page.repo %}
    <p class="mt-14">
        <a href="{{ page.repo }}" target="_blank" class="font-mono text-[10px] uppercase tracking-[0.25em] text-zinc-500 hover:text-accent transition underline underline-offset-8">Source on GitHub</a>
    </p>
    {% endif %}
</article>

<div class="modal-overlay" id="imageModal">
    <div class="modal-content relative">
        <button onclick="document.getElementById('imageModal').classList.remove('active')" class="absolute -top-12 right-0 text-zinc-300 hover:text-accent font-mono text-xs uppercase tracking-[0.2em]">Close</button>
        <img src="" alt="Full-screen image" id="modalImage">
    </div>
</div>

<script>
    document.querySelectorAll('.lightbox-content img').forEach(function (img) {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function () {
            document.getElementById('modalImage').src = img.src;
            document.getElementById('imageModal').classList.add('active');
        });
    });
    document.getElementById('imageModal').addEventListener('click', function (e) {
        if (e.target === this) this.classList.remove('active');
    });
</script>
