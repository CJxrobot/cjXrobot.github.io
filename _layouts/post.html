---
layout: default
---
<article class="container mx-auto px-8 pb-32 max-w-2xl">
    <p class="text-center mb-16">
        <a href="{{ '/log/' | relative_url }}" class="text-[10px] uppercase tracking-[0.3em] text-zinc-400 hover:text-zinc-900 transition">&larr; Back to log</a>
    </p>

    <div class="text-center mb-3">
        <span class="text-[9px] uppercase tracking-[0.2em] text-zinc-400">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags %} &middot; {{ page.tags | join: " / " }}{% endif %}</span>
    </div>
    <h1 class="text-xl font-light text-zinc-900 tracking-tight text-center mb-12">{{ page.title }}</h1>

    <div class="prose prose-zinc prose-sm font-light text-zinc-500 leading-relaxed max-w-none">
        {{ content }}
    </div>
</article>
