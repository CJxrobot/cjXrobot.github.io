---
layout: default
---
<article class="container mx-auto px-6 md:px-8 pb-32 max-w-2xl">
    <p class="mb-16">
        <a href="{{ '/log/' | relative_url }}" class="font-mono text-[10px] uppercase tracking-[0.25em] text-zinc-500 hover:text-accent transition">&larr; Back to log</a>
    </p>

    <div class="mb-3">
        <span class="font-mono text-[9px] uppercase tracking-[0.2em] text-zinc-500">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags %} &middot; {{ page.tags | join: " / " }}{% endif %}</span>
    </div>
    <h1 class="font-display font-semibold text-xl md:text-2xl text-zinc-50 tracking-tight mb-12">{{ page.title }}</h1>

    <div class="prose prose-invert prose-sm font-light text-zinc-400 leading-relaxed max-w-none">
        {{ content }}
    </div>
</article>
