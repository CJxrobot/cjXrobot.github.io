<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/tailwind.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/extra.css' | relative_url }}">
    {% feed_meta %}
    {% seo %}
</head>
<body class="bg-white text-zinc-900 antialiased">

    <nav class="fixed top-0 w-full z-40 bg-white/90 backdrop-blur-md border-b-2 border-zinc-900">
        <div class="container mx-auto px-6 md:px-8 py-5 flex justify-between items-center">
            <a href="{{ '/' | relative_url }}" class="flex items-center gap-2 font-mono text-xs uppercase tracking-[0.2em] font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-accent"></span>
                {{ site.title }}
            </a>
            <div class="flex gap-6 md:gap-8 font-mono text-[10px] uppercase tracking-[0.25em] text-zinc-500">
                <a href="{{ '/#profile' | relative_url }}" class="hover:text-accent transition">Profile</a>
                <a href="{{ '/#work' | relative_url }}" class="hover:text-accent transition">Projects</a>
                <a href="{{ '/log/' | relative_url }}" class="hover:text-accent transition">Log</a>
                <a href="{{ '/#contact' | relative_url }}" class="hover:text-accent transition">Contact</a>
            </div>
        </div>
    </nav>

    <div class="pt-24">
        {{ content }}
    </div>

    <footer class="pb-16 pt-12 border-t-2 border-zinc-900 mt-32">
        <div class="container mx-auto px-6 md:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-zinc-500">&copy; {{ 'now' | date: "%Y" }} {{ site.author }} — Built with Jekyll on GitHub Pages</p>
            <div class="flex gap-6 font-mono text-[10px] uppercase tracking-[0.2em] text-zinc-500">
                <a href="https://github.com/{{ site.github_username }}" target="_blank" class="hover:text-accent transition">GitHub</a>
                <a href="{{ '/log/' | relative_url }}" class="hover:text-accent transition">Log</a>
            </div>
        </div>
    </footer>

</body>
</html>
