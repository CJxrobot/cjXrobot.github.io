<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/extra.css' | relative_url }}">
    {% feed_meta %}
    {% seo %}
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased">

    <nav class="fixed top-0 w-full z-40 bg-zinc-50/80 backdrop-blur-md">
        <div class="container mx-auto px-8 py-8 flex justify-between items-center">
            <a href="{{ '/' | relative_url }}" class="text-xs tracking-[0.2em] uppercase font-medium">{{ site.title }}</a>
            <div class="flex gap-8 text-[10px] uppercase tracking-[0.3em] text-zinc-400">
                <a href="{{ '/#profile' | relative_url }}" class="hover:text-zinc-900 transition">Profile</a>
                <a href="{{ '/#work' | relative_url }}" class="hover:text-zinc-900 transition">Work</a>
                <a href="{{ '/log/' | relative_url }}" class="hover:text-zinc-900 transition">Log</a>
                <a href="{{ '/#contact' | relative_url }}" class="hover:text-zinc-900 transition">Contact</a>
            </div>
        </div>
    </nav>

    <div class="pt-32">
        {{ content }}
    </div>

    <footer class="pb-16 pt-16 border-t border-zinc-200 mt-32 text-center">
        <p class="text-[9px] uppercase tracking-[0.2em] text-zinc-400">Built with Jekyll, hosted on GitHub Pages</p>
    </footer>

</body>
</html>
