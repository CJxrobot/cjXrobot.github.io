<a href="{{ include.project.url | relative_url }}" class="project-card group block border-2 border-zinc-900 hover:border-accent transition-colors">
    <div class="overflow-hidden aspect-[4/3] border-b-2 border-zinc-900">
        <img src="{{ include.project.image }}" alt="{{ include.project.title }}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
    </div>
    <div class="p-5">
        <div class="flex justify-between items-start gap-3 mb-1">
            <span class="font-mono text-[10px] text-zinc-400">{{ include.project.year }}</span>
            <div class="flex flex-wrap gap-1.5 justify-end">
                {% if include.project.status %}
                <span class="font-mono text-[9px] uppercase tracking-[0.15em] text-zinc-500 border border-zinc-300 px-1.5 py-0.5">{{ include.project.status }}</span>
                {% endif %}
                {% if include.project.domain %}
                <span class="font-mono text-[9px] uppercase tracking-[0.15em] text-accent whitespace-nowrap">{{ include.project.domain }}</span>
                {% endif %}
            </div>
        </div>
        <h4 class="font-display font-medium text-base text-zinc-900 tracking-tight mb-2">{{ include.project.title }}</h4>
        <p class="text-xs text-zinc-600 font-light leading-relaxed mb-4">{{ include.project.summary }}</p>
        <div class="flex flex-wrap gap-x-3 gap-y-1 font-mono text-[13.5px] uppercase tracking-[0.15em] text-zinc-900">
            {% for tag in include.project.tags %}<span>{{ tag }}</span>{% endfor %}
        </div>
    </div>
</a>
