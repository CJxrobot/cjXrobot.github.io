title: Yu Jen Chen
tagline: Full-Stack Robotics Engineer
description: >-
  Full-Stack Robotics Engineer working across hardware and software —
  PCB design, embedded firmware, and ROS2 system integration. Portfolio
  and daily learning log.
author: Yu Jen Chen
email: yujen_chen@protonmail.com
github_username: CJxrobot
url: "https://cjxrobot.github.io"
baseurl: ""

hardware_skills:
  - PCB Design & Fabrication
  - Embedded Firmware (STM32 / ESP32)
  - Sensor Integration — ToF, IMU
  - Analog & Signal Electronics
  - Mechanical & Robotics Hardware

software_skills:
  - ROS2 System Integration
  - MoveIt 2 Motion Planning
  - Real-Time Control — RTOS, PID
  - Computer Vision & Perception
  - Firmware / Embedded Software

markdown: kramdown
permalink: /log/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /work/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# GitHub Pages builds with the github-pages gem (see Gemfile).
# Keep only GH-Pages-whitelisted plugins above.

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - tailwind.config.js
  - assets/css/tailwind.src.css
  - preview.html
